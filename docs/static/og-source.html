<!DOCTYPE html>
<!-- Source for og.png, the 1200x630 social card. Kept in the repo so the card
     is reproducible: screenshot this page with headless Chrome at exactly
     1200x630 (SITE.md, "Regenerate the OG card"; --virtual-time-budget=3000
     is cheap insurance that the webfonts are in before the capture), then
     look at the PNG. The card is pinned to the viewport's top-left and fills it.

     The chart is the landing page's knowledge sky held still: the hero's 25
     memories in their kind colors, placed by the same seeded layout as
     home.js (rng(20261008), the MEMS table, the polar mapping, the
     constellation rule) at rot = -152 degrees. The arriving session and the
     memory it writes are placed by hand. Every coordinate is precomputed, so
     nothing here is random at render time.

     The headline mirrors og:title / og:image:alt in index.html (and
     ogImageAlt in cmd/docsgen/canonical.go): change them together. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Seamless social card</title>
<style>
  @font-face { font-family: "Fraunces"; src: url("fonts/fraunces.woff2") format("woff2"); font-weight: 300 700; font-style: normal; font-display: block; }
  @font-face { font-family: "Fraunces"; src: url("fonts/fraunces-italic.woff2") format("woff2"); font-weight: 300 700; font-style: italic; font-display: block; }
  @font-face { font-family: "Instrument Sans"; src: url("fonts/instrument-sans.woff2") format("woff2"); font-weight: 400 700; font-stretch: 75% 100%; font-display: block; }
  @font-face { font-family: "IBM Plex Mono"; src: url("fonts/ibm-plex-mono-400.woff2") format("woff2"); font-weight: 400; font-display: block; }
  @font-face { font-family: "IBM Plex Mono"; src: url("fonts/ibm-plex-mono-500.woff2") format("woff2"); font-weight: 500 600; font-display: block; }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #070a13; }
  #card {
    position: fixed; top: 0; left: 0;
    width: 1200px; height: 630px; overflow: hidden;
    background: #070a13;   /* flat on purpose: big gradients dither and triple the PNG */
    color: #f2f1f8;
    font-family: "Instrument Sans", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #sky { position: absolute; top: 0; left: 0; display: block; }
  #sky .new {
    font: 500 13px "IBM Plex Mono", monospace; fill: #f3c46b;
    /* a cartographer's halo: lines under the label stop short of the glyphs */
    paint-order: stroke; stroke: #0d101b; stroke-width: 5px; stroke-linejoin: round;
  }

  .brand {
    position: absolute; left: 72px; top: 62px;
    display: flex; align-items: center; gap: 15px;
  }
  .mark { width: 50px; height: 50px; display: block; }
  .word {
    font-family: "Fraunces", serif;
    font-size: 44px; font-weight: 500; line-height: 1;
    letter-spacing: -0.015em;
    font-variation-settings: "opsz" 48, "SOFT" 60;
    padding-bottom: 4px;
  }

  .copy { position: absolute; left: 72px; top: 172px; width: 680px; }
  h1 {
    font-family: "Fraunces", serif;
    font-size: 82px; line-height: 1; font-weight: 400;
    letter-spacing: -0.028em;
    font-variation-settings: "opsz" 144, "SOFT" 30;
  }
  h1 span { display: block; }
  h1 em {
    font-style: italic; font-weight: 380;
    color: #f3c46b;
    font-variation-settings: "opsz" 144, "SOFT" 100;
    text-shadow: 0 0 46px rgba(243, 196, 107, 0.3);
  }
  .sub {
    margin-top: 30px;
    font-size: 28px; line-height: 1.3; font-weight: 500;
    letter-spacing: -0.003em;
    color: #c5c8dc;
  }

  .foot {
    position: absolute; left: 72px; right: 72px; bottom: 50px;
    display: flex; justify-content: space-between; align-items: baseline;
    font-family: "IBM Plex Mono", monospace; font-size: 22px; font-weight: 400;
    color: #9196b4;
  }
  .foot .p { color: #f3c46b; margin-right: 0.5em; }
  .foot .dom { color: #f2f1f8; font-weight: 500; }
</style>
</head>
